services:
  db:
    image: postgres:16-alpine
    container_name: webportv2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: webport
      POSTGRES_PASSWORD: webport
      POSTGRES_DB: webportv2
    ports:
      - "5433:5432"
    volumes:
      - webportv2_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webport -d webportv2"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  webportv2_pg:
